<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>読解練習（期末テストへ向けて）</title><style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#142d42;background:#eaf3f8}*{box-sizing:border-box}body{margin:0}.app{max-width:1250px;margin:0 auto;padding:18px 25px 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:26px;font-weight:900;color:#155e8c}.progress{font-weight:800;font-size:18px;background:white;border-radius:100px;padding:10px 20px}.bar{height:9px;background:#d1e5f0;border-radius:20px;margin:13px 0 20px;overflow:hidden}.fill{height:100%;background:#1689c3;transition:width .3s}.card{background:white;border-radius:24px;padding:26px 34px;box-shadow:0 12px 35px #16496a18}.category{display:inline-block;background:#e5f5ff;color:#1269a3;padding:7px 16px;border-radius:30px;font-weight:900;letter-spacing:.07em}.prompt{margin:14px 0 16px;font-size:clamp(19px,2.15vw,30px);line-height:1.65;font-weight:750}.sentence{display:block;margin:3px 0}.ja{display:block;color:#bd5a21;font-size:.68em;font-weight:700;line-height:1.35;margin:-2px 0 7px 0}.hintbtn{background:#fff2c8;color:#825700;border:2px solid #f6d576;border-radius:14px;padding:10px 18px;font-weight:900;font-size:18px;cursor:pointer}.instruction{color:#536879;font-size:15px;margin:9px 0 15px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.choice{border:3px solid #dbe7ee;background:#fff;border-radius:19px;min-height:208px;cursor:pointer;padding:13px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;transition:.15s}.choice:hover:not(:disabled){border-color:#5ab0df;transform:translateY(-2px)}.choice:disabled{cursor:default}.choice .word{font-size:clamp(15px,1.75vw,24px);font-weight:900;text-align:center;overflow-wrap:anywhere}.choice .icon{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:clamp(63px,8vw,112px);line-height:1.1;filter:drop-shadow(0 5px 3px #203f5317)}.choice .letter{font-size:14px;font-weight:900;color:#8299a8}.choice.correct{border-color:#19a575;background:#e7fff4}.choice.wrong{border-color:#dc5d59;background:#fff0ee}.feedback{margin-top:18px;padding:18px 21px;border-radius:16px;background:#f1f8fc;border:2px solid #d7e9f3}.feedback.good{background:#e9fff4;border-color:#95e3c0}.feedback.bad{background:#fff2ed;border-color:#f0b5a5}.verdict{font-size:26px;font-weight:950}.why{font-size:17px;line-height:1.7}.evidence{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{background:white;border:1px solid #c6dfe8;border-radius:12px;padding:7px 11px;font-weight:750}.pill small{display:block;color:#b65d27}.next{margin-top:15px;background:#126fa7;border:0;color:white;font-size:21px;font-weight:900;padding:14px 25px;border-radius:15px;cursor:pointer}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#5d7888;font-size:14px}.end{text-align:center;padding:70px 20px}.end h1{font-size:44px}.end p{font-size:27px}.end button{background:#126fa7;color:white;padding:17px 28px;border:0;border-radius:14px;font-size:20px;font-weight:800;cursor:pointer}@media(max-width:760px){.app{padding:12px}.card{padding:16px}.choices{grid-template-columns:repeat(2,1fr);gap:10px}.choice{min-height:155px}.choice .icon{font-size:65px}.prompt{font-size:20px}.logo{font-size:20px}.choice .word{font-size:18px}}
.travel{display:flex;justify-content:center;align-items:center;gap:22px;background:#f0f8fd;border-radius:16px;margin:16px 0;padding:12px}.travel-flag{font-size:clamp(52px,7vw,90px)}.travel-arrow{font-size:clamp(24px,4vw,45px)}.vocab{margin:9px 0 14px;padding:10px 14px;background:#f5f7fb;border-left:4px solid #8aa7c4;border-radius:8px;font-size:clamp(15px,1.6vw,19px);display:flex;flex-wrap:wrap;gap:10px 18px}.vocab-item{font-weight:650}.try-again{margin-top:18px;padding:15px;border:2px solid #e78c84;background:#fff0ee;border-radius:15px;color:#b62d27;font-size:clamp(18px,2.4vw,28px);font-weight:900;text-align:center}
.choice.wrong{border:5px solid #d52b2b!important;background:#ffd5d5!important;opacity:.78}
.explanation{text-align:center}.answer-heading{font-size:clamp(30px,4vw,52px);color:#128358;margin:16px 0}

.schedule-choice{justify-content:flex-start;gap:7px;min-height:235px;padding:10px 6px}.schedule-step{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;border-bottom:1px dashed #d9e2e9;padding:4px 8px}.schedule-step:last-child{border:0}.schedule-emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:clamp(28px,3.8vw,52px)}.schedule-time{font-size:clamp(18px,2.2vw,30px);font-weight:900;font-variant-numeric:tabular-nums;color:#1a4e6d}.schedule-choice .letter{align-self:flex-start;padding-left:10px}.answer-hero .schedule-step{max-width:400px;padding:9px 18px}.answer-hero .schedule-emoji{font-size:52px}.answer-hero .schedule-time{font-size:34px}@media(max-width:760px){.schedule-emoji{font-size:30px}.schedule-time{font-size:18px}.schedule-choice{min-height:175px}.schedule-step{gap:2px;padding:5px 2px}}

.country-choice{padding:5px;min-height:235px}.country-choice .country-graphic{width:100%;max-width:260px;display:block}.country-choice .word{font-size:16px}.country-choice .letter{align-self:flex-start;padding-left:9px}.country-graphic svg{display:block;width:100%;height:auto}

</style></head><body><main class="app"><header class="top"><div class="logo">読解練習（期末テストへ向けて） · Level 2</div><div id="counter" class="progress">1 / 15</div></header><div class="bar"><div id="fill" class="fill"></div></div><div id="screen"></div><footer class="bottom"><span>Read → Hint (optional) → Choose → Explanation</span><span>Grade 7 · Level 2 · 15 questions</span></footer></main><script>
const QUESTIONS=[{"cat":"Food","lines":[[["It is a green vegetable.","それは緑色の野菜です。"]],[["It looks like a small tree.","それは小さな木のように見えます。"]],[["You can eat it in a salad.","あなたはそれをサラダに入れて食べることができます。"]],[["What is this vegetable?","これは何の野菜ですか。"]]],"opts":[{"name":"carrot","icon":"🥕"},{"name":"broccoli","icon":"🥦"},{"name":"tomato","icon":"🍅"},{"name":"corn","icon":"🌽"}],"ans":1,"notes":"緑色で小さな木のような形をした野菜はブロッコリーです。","keys":["green vegetable","small tree","in a salad"],"vocab":[]},{"cat":"Daily Life","lines":[[["I get up at 6:00.","私は6:00に起きます。"]],[["I eat breakfast at 7:00.","私は7:00に朝食を食べます。"]],[["I go to school at 7:30.","私は7:30に学校へ行きます。"]],[["I go home at 4:00.","私は4:00に家に帰ります。"]]],"opts":[{"name":"A","icon":"🕒"},{"name":"B","icon":"🕒"},{"name":"C","icon":"🕒"},{"name":"D","icon":"🕒"}],"ans":0,"notes":"英文の中にある「go to school at 7:30」と、イラストの動作・時刻が一致しています。","keys":[],"vocab":[],"scheduleOpts":[[{"act":"go to school","time":"7:30","icon":"🏫"}],[{"act":"do my homework","time":"7:30"}],[{"act":"take a bath","time":"7:30"}],[{"act":"go to bed","time":"7:30"}]],"schedule":true},{"cat":"Animal","lines":[[["I live in the sea.","私は海に住んでいます。"]],[["I have eight arms.","私には8本の腕があります。"]],[["I can change my color.","私は体の色を変えることができます。"]],[["I can swim and hide under rocks.","私は泳いだり、岩の下に隠れたりできます。"]]],"opts":[{"name":"shark","icon":"🦈"},{"name":"dolphin","icon":"🐬"},{"name":"octopus","icon":"🐙"},{"name":"turtle","icon":"🐢"}],"ans":2,"notes":"8本の腕があり、体の色を変えられる動物はタコです。","keys":[],"vocab":[["hide","隠れる"]]},{"cat":"Sports","lines":[[["I play it with a ball.","私はボールを使ってそれをします。"]],[["I use my hands.","私は手を使います。"]],[["I throw the ball into a basket.","私はボールをバスケットに投げ入れます。"]],[["What sport is it?","それは何のスポーツですか。"]]],"opts":[{"name":"soccer","icon":"⚽"},{"name":"basketball","icon":"🏀"},{"name":"baseball","icon":"⚾"},{"name":"tennis","icon":"🎾"}],"ans":1,"notes":"手でボールを投げてバスケットに入れるスポーツはバスケットボールです。","keys":[],"vocab":[["throw","投げる"]]},{"cat":"Jobs","lines":[[["I work at a school.","私は学校で働きます。"]],[["I "私はオーストラリアに住んでいます。"]],[["I can jump very high.","私はとても高くジャンプできます。"]],[["I carry my baby in a pouch.","私は赤ちゃんをおなかの袋に入れて運びます。"]]],"opts":[{"name":"koala","icon":"🐨"},{"name":"kangaroo","icon":"🦘"},{"name":"rabbit","icon":"🐇"},{"name":"lion","icon":"🦁"}],"ans":1,"notes":"オーストラリアに住み、高くジャンプして、おなかの袋で赤ちゃんを運ぶ動物はカンガルーです。","keys":["Australia","jump very high","baby in a pouch"],"vocab":[["pouch","おなかの袋"]]},{"cat":"Daily Life","lines":[[["I get up at 6:30.","私は6:30に起きます。"]],[["I read a book at 7:00.","私は7:00に本を読みます。"]],[["I eat breakfast at 7:30.","私は7:30に朝食を食べます。"]],[["I go to school at 8:00.","私は8:00に学校へ行きます。"]]],"opts":[{"name":"A","icon":"🕒"},{"name":"B","icon":"🕒"},{"name":"C","icon":"🕒"},{"name":"D","icon":"🕒"}],"ans":0,"notes":"英文の中にある「read a book at 7:00」と、イラストの動作・時刻が一致しています。","keys":[],"vocab":[],"scheduleOpts":[[{"act":"read a book","time":"7:00","icon":"📖"}],[{"act":"get up","time":"7:00"}],[{"act":"eat breakfast","time":"7:00"}],[{"act":"go to school","time":"7:00"}]],"schedule":true},{"cat":"Sports","lines":[[["I use a ball and a bat.","私はボールとバットを使います。"]],[["There are nine players on one team.","1チームには9人の選手がいます。"]],[["I hit the ball with a bat.","私はバットでボールを打ちます。"]],[["What sport is it?","それは何のスポーツですか。"]]],"opts":[{"name":"tennis","icon":"🎾"},{"name":"baseball","icon":"⚾"},{"name":"soccer","icon":"⚽"},{"name":"badminton","icon":"🏸"}],"ans":1,"notes":"バットでボールを打ち、1チーム9人で行うスポーツは野球です。","keys":["ball and a bat","nine players","hit the ball"],"vocab":[]},{"cat":"Jobs","lines":[[["I work at a hospital.","私は病院で働いています。"]],[["I help sick people.","私は病気の人々を助けます。"]],[["I work with doctors.","私は医師と一緒に働いています。"]],[["What is my job?","私の仕事は何ですか。"]]],"opts":[{"name":"nurse","icon":"🧑‍⚕️"},{"name":"soccer player","icon":"⚽"},{"name":"doctor","icon":"👨‍⚕️"},{"name":"singer","icon":"🎤"}],"ans":0,"notes":"病院で医師と協力し、患者を助ける職業は看護師です。","keys":["at a hospital","help sick people","with doctors"],"vocab":[["sick people","病気の人々"]]},{"cat":"Countries","lines":[[["I'm from America.","私はAmerica出身です。"]],[["I live in Canada now.","私は今Canadaに住んでいます。"]]],"opts":[{"name":"Canada","icon":"🇨🇦"},{"name":"China","icon":"🇨🇳"},{"name":"Australia","icon":"🇦🇺"},{"name":"Japan","icon":"🇯🇵"}],"ans":0,"notes":"出身はAmericaですが、今住んでいるのはCanadaです。","keys":[],"vocab":[],"travel":{"from":"America","to":"Canada"}},{"cat":"Daily Life","lines":[[["I go home at 4:00.","私は4:00に家に帰ります。"]],[["I practice the piano at 4:30.","私は4:30にピアノを練習します。"]],[["I take a bath at 7:00.","私は7:00にお風呂に入ります。"]],[["I go to bed at 9:00.","私は9:00に寝ます。"]]],"opts":[{"name":"A","icon":"🕒"},{"name":"B","icon":"🕒"},{"name":"C","icon":"🕒"},{"name":"D","icon":"🕒"}],"ans":2,"notes":"英文の中にある「take a bath at 7:00」と、イラストの動作・時刻が一致しています。","keys":[],"vocab":[],"scheduleOpts":[[{"act":"go home","time":"7:00"}],[{"act":"eat dinner","time":"7:00"}],[{"act":"take a bath","time":"7:00","icon":"🛁"}],[{"act":"do my homework","time":"7:00"}]],"schedule":true},{"cat":"Daily Life","lines":[[["I get up at 6:30.","私は6:30に起きます。"]],[["I eat breakfast at 7:00.","私は7:00に朝食を食べます。"]],[["I go to school at 8:00.","私は8:00に学校へ行きます。"]]],"opts":[{"name":"A","icon":"🕒"},{"name":"B","icon":"🕒"},{"name":"C","icon":"🕒"},{"name":"D","icon":"🕒"}],"ans":0,"notes":"英文の中にある「eat breakfast at 7:00」と、イラストの動作・時刻が一致しています。","keys":[],"vocab":[],"scheduleOpts":[[{"act":"eat breakfast","time":"7:00","icon":"🍞"}],[{"act":"eat dinner","time":"7:00"}],[{"act":"do my homework","time":"7:00"}],[{"act":"take a bath","time":"7:00"}]],"schedule":true}];
let current=0,score=0,hint=false,answered=false,wrongChoices=new Set();
const screen=document.getElementById('screen');
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}

const FLAG={Australia:'🇦🇺',Japan:'🇯🇵',America:'🇺🇸',Canada:'🇨🇦',China:'🇨🇳',India:'🇮🇳'};
const SCENE={Australia:['🦘','Sydney'],Japan:['🗻','Tokyo'],America:['🗽','New York'],Canada:['🍁','Canada'],China:['🐼','Great Wall'],India:['🕌','India']};
function countryArt(from,to){
 const f=SCENE[from]||['🌏',from],t=SCENE[to]||['🌏',to];
 const wrap=el('div','country-graphic');
 wrap.innerHTML=`<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${from} から ${to} へ引っ越すイラスト">
 <rect x="2" y="2" width="316" height="186" rx="14" fill="#f4fbff" stroke="#c9e4ee" stroke-width="2"/>
 <rect x="14" y="12" width="105" height="47" rx="6" fill="white" stroke="#b4c7d1"/><text x="66" y="47" text-anchor="middle" font-size="35">${FLAG[from]}</text>
 <rect x="201" y="12" width="105" height="47" rx="6" fill="white" stroke="#b4c7d1"/><text x="254" y="47" text-anchor="middle" font-size="35">${FLAG[to]}</text>
 <path d="M98 95 Q160 32 227 95" stroke="#227cb1" stroke-width="4" fill="none" stroke-dasharray="8 6"/><path d="M222 83 L236 99 L217 97" fill="#227cb1"/>
 <text x="158" y="79" font-size="29" text-anchor="middle">✈️</text>
 <text x="65" y="139" font-size="55" text-anchor="middle">${f[0]}</text><text x="256" y="139" font-size="55" text-anchor="middle">${t[0]}</text>
 <text x="160" y="148" font-size="44" text-anchor="middle">🧑</text>
 <text x="67" y="176" font-size="17" font-weight="bold" text-anchor="middle" fill="#25475c">${from}</text><text x="255" y="176" font-size="17" font-weight="bold" text-anchor="middle" fill="#25475c">${to}</text>
 </svg>`;return wrap;
}
const OBJECTS={
 'get up':['🛏️','🌞'],'eat breakfast':['🍞','🥛'],'go to school':['🎒','🏫'],'go home':['🏠','🎒'],'eat dinner':['🍚','🥢'],'do my homework':['📖','✏️'],'take a bath':['🛁','🫧'],'go to bed':['🛏️','🌙'],'read a book':['📘','📚'],'watch TV':['📺','🎬'],'practice the piano':['🎹','🎵']
};
function activityArt(act){
 const [a,b]=OBJECTS[act]||['⭐','📝'];let box=el('div','activity-illustration');
 box.innerHTML=`<svg viewBox="0 0 140 105" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${act} のイラスト">
 <rect x="1" y="1" width="138" height="103" rx="10" fill="#fff8e9" stroke="#eee2ca"/>
 <ellipse cx="69" cy="91" rx="53" ry="6" fill="#e6d8c8"/>
 <path d="M48 85 L48 62 Q69 50 90 62 L90 85" fill="#f2bb56" stroke="#735d53" stroke-width="2"/>
 <circle cx="69" cy="40" r="22" fill="#ffd5b1" stroke="#735d53" stroke-width="2"/>
 <path d="M48 39 Q47 12 69 15 Q91 12 91 39 L85 29 Q72 31 62 23 Q57 34 48 39" fill="#414046"/>
 <circle cx="61" cy="42" r="2" fill="#3e3838"/><circle cx="77" cy="42" r="2" fill="#3e3838"/><path d="M63 52 Q69 57 75 52" fill="none" stroke="#a46c64" stroke-width="2"/>
 <text x="25" y="82" font-size="31" text-anchor="middle">${a}</text><text x="113" y="82" font-size="28" text-anchor="middle">${b}</text>
 </svg>`;return box;
}
function addScheduleStep(container,step){const r=el('div','schedule-step');r.append(activityArt(step.act));r.append(el('span','schedule-time',step.time));container.append(r);}

function render(){
 document.getElementById('counter').textContent=`${Math.min(current+1,QUESTIONS.length)} / ${QUESTIONS.length}`;
 document.getElementById('fill').style.width=(current/QUESTIONS.length*100)+'%';
 if(current>=QUESTIONS.length){end();return;}
 const q=QUESTIONS[current];screen.replaceChildren();const card=el('section','card');screen.append(card);
 const category=el('div','category',`QUESTION ${current+1} · ${q.cat.toUpperCase()}`);card.append(category);
 const prompt=el('div','prompt');card.append(prompt);
 q.lines.forEach(line=>{const s=el('div','sentence');line.forEach(([en,ja])=>{const t=el('span','en',en);s.append(t);if(hint&&ja){s.append(el('span','ja',ja));}});prompt.append(s);});
 if(q.vocab && q.vocab.length){const vocab=el('div','vocab');vocab.append(el('strong','','（注）'));q.vocab.forEach(([en,ja])=>vocab.append(el('span','vocab-item',en+'：'+ja)));card.append(vocab);}
 const hintBtn=el('button','hintbtn',hint?'💡 Hide Hints / ヒントを隠す':'💡 Hint / ヒント');hintBtn.type='button';hintBtn.addEventListener('click',()=>{hint=!hint;render();});card.append(hintBtn);
 card.append(el('p','instruction',q.schedule?'Choose the picture that matches one sentence. / 英文のどれか１文と合うイラストを選ぼう。':'Choose one illustration. / イラストを１つ選ぼう。'));
 const choices=el('div','choices');card.append(choices);
 q.opts.forEach((opt,i)=>{const b=el('button','choice'+(wrongChoices.has(i)?' wrong':'')+(q.schedule?' schedule-choice':''));b.type='button';if(wrongChoices.has(i))b.disabled=true;b.append(el('div','letter',String.fromCharCode(65+i)));if(q.schedule){q.scheduleOpts[i].forEach(step=>addScheduleStep(b,step));}else if(q.travel){b.classList.add('country-choice');b.append(countryArt(q.travel.from,opt.name));}else{b.append(el('div','word',opt.name));b.append(el('div','icon',opt.icon));}b.addEventListener('click',()=>answer(i));choices.append(b);});
}

let soundCtx=null;
function playFeedbackSound(correct){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!soundCtx)soundCtx=new AC();
  if(soundCtx.state==='suspended')soundCtx.resume();
  const t=soundCtx.currentTime;
  const tone=(freq,start,duration,type,volume,endFreq)=>{
   const osc=soundCtx.createOscillator(),gain=soundCtx.createGain();
   osc.type=type;osc.frequency.setValueAtTime(freq,start);
   if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,start+duration);
   gain.gain.setValueAtTime(.0001,start);
   gain.gain.exponentialRampToValueAtTime(volume,start+.015);
   gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
   osc.connect(gain);gain.connect(soundCtx.destination);osc.start(start);osc.stop(start+duration+.015);
  };
  if(correct){tone(660,t,.15,'sine',.14,880);tone(988,t+.13,.32,'sine',.16,1320);}
  else{tone(190,t,.28,'sawtooth',.075,105);tone(135,t+.03,.24,'triangle',.08,90);}
 }catch(e){}
}

function answer(i){
 if(answered || wrongChoices.has(i))return;
 const q=QUESTIONS[current];
 if(i!==q.ans){
   playFeedbackSound(false);
   wrongChoices.add(i);
   const btn=screen.querySelectorAll('.choice')[i];
   btn.classList.add('wrong');btn.disabled=true;
   let msg=screen.querySelector('.try-again');
   if(!msg){msg=el('div','try-again','NO!');screen.querySelector('.card').append(msg);}
   return;
 }
 playFeedbackSound(true);
 answered=true;score++;
 showExplanation();
}
function showExplanation(){
 const q=QUESTIONS[current];screen.replaceChildren();
 const card=el('section','card explanation');screen.append(card);
 card.append(el('div','category',`QUESTION ${current+1} · ANSWER`));
 card.append(el('h1','answer-heading','⭕ Correct! / 正解！'));
 const answerCard=el('div','answer-hero');
 if(q.schedule){q.scheduleOpts[q.ans].forEach(step=>addScheduleStep(answerCard,step));}else if(q.travel){answerCard.append(countryArt(q.travel.from,q.travel.to));}else{answerCard.append(el('div','answer-icon',q.opts[q.ans].icon));answerCard.append(el('div','answer-word',q.opts[q.ans].name));}
 card.append(answerCard);
 card.append(el('p','why',q.notes));
 card.append(el('h2','evidence-title','🔍 Key Clues / 答えの根拠'));
 const evidence=el('div','evidence');
 q.lines.forEach(line=>line.forEach(([en,ja])=>{if(ja){const pill=el('div','pill',en);pill.append(el('small','',ja));evidence.append(pill);}}));
 card.append(evidence);
 const next=el('button','next',current===QUESTIONS.length-1?'See Results →':'Next Question →');
 next.addEventListener('click',()=>{current++;answered=false;hint=false;wrongChoices.clear();render();window.scrollTo({top:0,behavior:'smooth'});});
 card.append(next);
 document.getElementById('fill').style.width=((current+1)/QUESTIONS.length*100)+'%';
 window.scrollTo({top:0,behavior:'smooth'});
}
function end(){screen.replaceChildren();const box=el('section','card end');box.append(el('h1','', '🎉 Great Job!'));box.append(el('p','',`Score: ${score} / ${QUESTIONS.length}`));const b=el('button','','Play Again / もう一度');b.addEventListener('click',()=>{current=0;score=0;hint=false;answered=false;wrongChoices.clear();render();});box.append(b);screen.append(box);}
render();
</script></body></html>
