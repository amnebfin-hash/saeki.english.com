<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>期末テスト対策 国語・数学・英語 12問</title>
<style>
:root{font-family:"Noto Sans JP",system-ui,sans-serif;color:#17243a;background:#edf3fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:20px auto;padding:0 14px}
header{background:#173f81;color:white;border-radius:20px;padding:20px 25px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:clamp(19px,3vw,29px);margin:0}header small{opacity:.9}
main{background:white;border-radius:22px;margin-top:16px;padding:clamp(18px,4vw,36px);box-shadow:0 8px 28px #243f6c17;min-height:550px}
.pill{display:inline-block;border-radius:30px;background:#e5efff;color:#164785;padding:7px 15px;font-weight:800}
h2{font-size:clamp(19px,3vw,27px);line-height:1.6}
.sentence{font-size:clamp(23px,3.5vw,34px);font-weight:750;background:#f3f7ff;border-left:5px solid #3e79c6;padding:20px;margin:18px 0;line-height:1.7}
.english{font-size:clamp(22px,3vw,29px);line-height:1.9;font-weight:700}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:24px 0}
.choice{background:white;border:2px solid #c4d5ed;border-radius:15px;min-height:88px;padding:14px;font-size:clamp(19px,2.6vw,26px);font-weight:750;cursor:pointer;transition:.1s}
.choice:hover:not(:disabled){border-color:#3066bf;background:#eff5ff}
.choice.bad{background:#ffe0e0;border-color:#e04747;color:#ad1919}
.choice:disabled{cursor:default}.choice.good{background:#dcf8e5;border-color:#2c9952}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
button.action{border:0;border-radius:12px;background:#2157a5;color:white;padding:13px 23px;font-size:17px;font-weight:750;cursor:pointer}
button.secondary{background:#e9eff9;color:#17427b}
.note{color:#ad2020;font-size:24px;font-weight:900;min-height:30px}
.hint{background:#fff8de;border:1px solid #ead08a;border-radius:12px;padding:15px;margin:14px 0;line-height:1.9;font-size:18px}
.graphbox{max-width:530px;margin:10px auto 24px}.graphbox svg{width:100%;height:auto;background:#fff;border:1px solid #cbd6e5;border-radius:12px}
.result{text-align:center}.result .mark{font-size:54px;color:#1c9b54}.explain{text-align:left;background:#f1f7ff;border-radius:14px;padding:20px;font-size:19px;line-height:1.85;margin:20px 0}
.progress{height:8px;background:#dce6f4;border-radius:10px;margin-top:12px;overflow:hidden}.progress div{height:100%;background:#75b6ff}
@media(max-width:580px){.answers{grid-template-columns:1fr}.choice{min-height:66px}header{align-items:flex-start}}
</style></head><body><div class="wrap"><header><div><h1>📘 期末テスト対策　国語・数学・英語</h1><small>国語4問・数学4問・英語4問</small></div><strong id="count">1 / 12</strong></header><div class="progress"><div id="bar"></div></div><main id="app"></main></div>
<script>
const Q=[{"cat": "国語", "kind": "jp", "stem": "次の文の主語を選びなさい。", "sentence": "僕は中学生です。", "options": ["僕は", "中学生", "です", "中学生です"], "correct": 0, "why": "「何が・誰が」に当たる部分は「僕は」です。「僕は」が主語、「中学生です」が述語です。"}, {"cat": "国語", "kind": "jp", "stem": "次の文の主語を選びなさい。", "sentence": "私の妹が公園で遊んでいます。", "options": ["私の妹が", "妹", "公園で", "遊んでいます"], "correct": 0, "why": "「誰が遊んでいますか」に当たる「私の妹が」が主語です。"}, {"cat": "国語", "kind": "jp", "stem": "次の文の主語を選びなさい。", "sentence": "昨日、学校の図書室で、友達も本を読みました。", "options": ["昨日", "学校の図書室で", "友達も", "本を"], "correct": 2, "why": "「誰が本を読みましたか」と考えます。「友達も」が主語です。「も」も主語を示すことがあります。"}, {"cat": "国語", "kind": "jp", "stem": "次の文の主語を選びなさい。", "sentence": "雨が降り始めたころ、駅の前には大勢の人が集まっていました。", "options": ["雨が", "駅の前には", "大勢の人が", "集まっていました"], "correct": 2, "why": "文全体の述語は「集まっていました」。それに対応する主語は「大勢の人が」です。「雨が」は途中の「降り始めた」に対応します。"}, {"cat": "数学", "kind": "math", "stem": "比例のグラフで、点Aの座標を選びなさい。", "formula": "y = 2x", "graph": "line", "a": [2, 4], "options": ["( 2 , 4 )", "( 4 , 2 )", "( 2 , 2 )", "( -2 , 4 )"], "correct": 0, "why": "横軸のxを先に、縦軸のyを後に読みます。Aは右へ2、上へ4なので ( 2 , 4 ) です。"}, {"cat": "数学", "kind": "math", "stem": "比例のグラフで、点Aの座標を選びなさい。", "formula": "y = -x", "graph": "line", "a": [-3, 3], "options": ["( 3 , -3 )", "( -3 , -3 )", "( -3 , 3 )", "( 3 , 3 )"], "correct": 2, "why": "Aは原点から左へ3、上へ3。xは-3、yは3なので ( -3 , 3 ) です。"}, {"cat": "数学", "kind": "math", "stem": "反比例のグラフで、点Aの座標を選びなさい。", "formula": "y = 6/x", "graph": "curve", "k": 6, "a": [2, 3], "options": ["( 3 , 2 )", "( 2 , 3 )", "( -2 , -3 )", "( 2 , 6 )"], "correct": 1, "why": "反比例 y=6/x で x=2 のとき y=3。Aは ( 2 , 3 ) です。"}, {"cat": "数学", "kind": "math", "stem": "反比例のグラフで、点Aの座標を選びなさい。", "formula": "y = -6/x", "graph": "curve", "k": -6, "a": [-2, 3], "options": ["( 2 , -3 )", "( -3 , 2 )", "( -2 , -3 )", "( -2 , 3 )"], "correct": 3, "why": "反比例 y=-6/x で x=-2 のとき y=3。第2象限にある点Aは ( -2 , 3 ) です。"}, {"cat": "英語", "kind": "en", "stem": "（　）に入る疑問詞を選びなさい。", "lines": ["(　　) is your favorite food?", "I like sushi."], "translation": ["あなたの好きな食べ物は何ですか。", "私は寿司が好きです。"], "options": ["When", "What", "Why", "Whose"], "correct": 1, "why": "「何」をたずねる疑問詞は What です。What is your favorite food? となります。"}, {"cat": "英語", "kind": "en", "stem": "（　）に入る疑問詞を選びなさい。", "lines": ["(　　) is your birthday?", "My birthday is August 8."], "translation": ["あなたの誕生日はいつですか。", "私の誕生日は8月8日です。"], "options": ["How", "Whose", "When", "What"], "correct": 2, "why": "「いつ」をたずねる疑問詞は When です。"}, {"cat": "英語", "kind": "en", "stem": "（　）に入る疑問詞を選びなさい。", "lines": ["(　　) do you like summer?", "Because I like swimming."], "translation": ["あなたはなぜ夏が好きなのですか。", "泳ぐことが好きだからです。"], "options": ["Why", "Where", "What", "How"], "correct": 0, "why": "Because（なぜなら〜だから）で答えているので、「なぜ」をたずねる Why です。"}, {"cat": "英語", "kind": "en", "stem": "（　）に入る疑問詞を選びなさい。", "lines": ["(　　) do you come to school?", "By bike."], "translation": ["あなたはどうやって学校に来ますか。", "自転車で来ます。"], "options": ["Who", "When", "Whose", "How"], "correct": 3, "why": "交通手段・方法をたずねる疑問詞は How です。Whose bag is this?（これは誰のかばんですか）の Whose は所有者をたずねるときに使います。"}];
let i=0,mode="question",hint=false,wrong=new Set(),audio;
const app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function tone(ok){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let t=audio.currentTime;function b(f,start,d,type="sine",gain=.1){let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t+start);g.gain.setValueAtTime(.001,t+start);g.gain.exponentialRampToValueAtTime(gain,t+start+.015);g.gain.exponentialRampToValueAtTime(.001,t+start+d);o.connect(g).connect(audio.destination);o.start(t+start);o.stop(t+start+d+.02)}if(ok){b(660,0,.17);b(990,.19,.3)}else{b(170,0,.28,"sawtooth",.06)}}catch(e){}}
function graph(q){const W=480,H=420,cx=240,cy=210,s=34;let a=[];for(let n=-6;n<=6;n++){let x=cx+n*s,y=cy+n*s;a.push(`<line x1="${x}" y1="6" x2="${x}" y2="${H-6}" stroke="#e7edf5"/><line x1="6" y1="${y}" x2="${W-6}" y2="${y}" stroke="#e7edf5"/>`)}
a.push(`<line x1="12" y1="${cy}" x2="${W-12}" y2="${cy}" stroke="#263e62" stroke-width="2"/><path d="M${W-18} ${cy-5} l8 5 -8 5" fill="none" stroke="#263e62" stroke-width="2"/><line x1="${cx}" y1="${H-12}" x2="${cx}" y2="12" stroke="#263e62" stroke-width="2"/><path d="M${cx-5} 18 l5 -8 5 8" fill="none" stroke="#263e62" stroke-width="2"/>`);
for(let n=-5;n<=5;n++){if(n){a.push(`<text x="${cx+n*s}" y="${cy+19}" font-size="12" text-anchor="middle" fill="#445">${n}</text><text x="${cx-12}" y="${cy-n*s+4}" font-size="12" text-anchor="end" fill="#445">${n}</text>`)}}a.push(`<text x="460" y="194">x</text><text x="253" y="21">y</text><text x="227" y="226" font-size="12">0</text>`);
let segments=[];if(q.graph==="line"){let m=q.formula==="y = 2x"?2:-1;segments.push(Array.from({length:241},(_,j)=>{let x=-6+j*.05,y=m*x;return `${j?"L":"M"}${cx+x*s} ${cy-y*s}`}).join(" "))}else{for(let sign of [-1,1]){segments.push(Array.from({length:119},(_,j)=>{let x=sign*(.15+j*.05),y=q.k/x;return `${j?"L":"M"}${cx+x*s} ${cy-y*s}`}).join(" "))}}
for(let d of segments)a.push(`<path d="${d}" fill="none" stroke="#1675cf" stroke-width="3" clip-path="url(#clip)"/>`);
let [x,y]=q.a,px=cx+x*s,py=cy-y*s;a.push(`<circle cx="${px}" cy="${py}" r="7" fill="#e63d3d" stroke="white" stroke-width="2"/><text x="${px+11}" y="${py-12}" font-size="22" font-weight="bold" fill="#d42d2d">A</text>`);
return `<div class="graphbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="座標平面のグラフ。赤い点Aの座標を読み取る"><defs><clipPath id="clip"><rect x="12" y="12" width="${W-24}" height="${H-24}"/></clipPath></defs>${a.join("")}</svg></div>`}
function render(){document.getElementById("count").textContent=`${Math.min(i+1,12)} / 12`;document.getElementById("bar").style.width=`${Math.min(i+1,12)/12*100}%`;if(i>=Q.length){app.innerHTML=`<div class="result"><div class="mark">🎉</div><h2>全12問終了！</h2><p>おつかれさまでした。</p><button class="action" onclick="restart()">もう一度</button></div>`;return}
const q=Q[i];if(mode==="answer"){app.innerHTML=`<div class="result"><span class="pill">${esc(q.cat)}　${i+1}問目</span><div class="mark">⭕</div><h2>${q.kind==="en"?"Correct!":"正解！"}</h2><div class="sentence">${esc(q.options[q.correct])}</div><div class="explain"><b>解説</b><p>${esc(q.why)}</p>${q.kind==="en"?`<p>${q.lines.map((s,j)=>esc(s.replace("（　　）",q.options[q.correct]))+"<br>→ "+esc(q.translation[j])).join("<br>")}</p>`:""}</div><button class="action" onclick="next()">次の問題へ ▶</button></div>`;return}
app.innerHTML=`<span class="pill">${esc(q.cat)}　問題 ${i+1}</span><h2>${esc(q.stem)}</h2>${q.kind==="jp"?`<div class="sentence">${esc(q.sentence)}</div>`:q.kind==="math"?graph(q):`<div class="sentence english">${q.lines.map(esc).join("<br>")}</div>`}<div class="answers">${q.options.map((v,j)=>`<button class="choice ${wrong.has(j)?"bad":""}" ${wrong.has(j)?"disabled":""} onclick="answer(${j})">${String.fromCharCode(65+j)}. ${esc(v)}</button>`).join("")}</div><div class="note" id="feedback">${wrong.size?(q.kind==="en"?"NO!":"ちがうよ！"):""}</div><div class="actions"><button class="action secondary" onclick="toggleHint()">${hint?"ヒントを閉じる":"💡 Hint"}</button></div>${hint?`<div class="hint"><b>ヒント</b><div>${q.kind==="en"?q.translation.map(esc).join("<br>"):q.kind==="math"?"座標は ( x , y ) の順番。横の値を先に、縦の値を後に読みます。":"「誰が」「何が」に当たる部分を探そう。「は」「が」「も」に注目！"}</div></div>`:""}`}
function answer(j){if(wrong.has(j))return;if(j===Q[i].correct){tone(true);mode="answer";render()}else{tone(false);wrong.add(j);render()}}
function toggleHint(){hint=!hint;render()}function next(){i++;mode="question";hint=false;wrong.clear();render()}function restart(){i=0;mode="question";hint=false;wrong.clear();render()}render();
</script></body></html>
